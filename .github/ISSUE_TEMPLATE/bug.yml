name: 故障反馈
description: 报告安装、监控、暂停或更新问题
body:
  - type: markdown
    attributes:
      value: 截图请遮住账号、联系方式和余额。不要上传密码、Token、完整配置或原始日志。
  - type: input
    id: versions
    attributes:
      label: 工具、雷神与 Windows 版本
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: 实际现象及复现步骤
      description: 说明游戏、所选等待时间、界面状态，以及账号是否仍在计费。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与已经尝试的操作
